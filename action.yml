name: agent-rules-lint
description: Check agent instruction files and produce SARIF for code scanning
author: Uky0Yang
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Repository directory to scan
    default: .
  warnings-as-errors:
    description: Fail when warnings are found
    default: 'false'
  output:
    description: SARIF output path
    default: agent-rules-lint.sarif
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
    - shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: python -m pip install "$ACTION_DIR"
    - shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        REPORT_PATH: ${{ inputs.output }}
        STRICT: ${{ inputs.warnings-as-errors }}
      run: |
        args=("$SCAN_PATH" --format sarif --output "$REPORT_PATH")
        if [[ "$STRICT" == "true" ]]; then args+=(--warnings-as-errors); fi
        agent-rules-lint "${args[@]}"
